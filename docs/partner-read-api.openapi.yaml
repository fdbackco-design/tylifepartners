openapi: 3.0.3
info:
  title: CRM 조회 API
  version: 0.1.0-draft
  description: |
    후보자(`public.tylife_b2b`), TM001(`tm001_customers` + `tm001_stays`),
    TM002(`tm002_customers`), 캘린더(여러 원천 병합)의 조회 명세.

    `/api/admin/...` 는 이미 구현된 내부 CRM API입니다. 쿠키 세션이 필요하고
    메모·코멘트·세션을 반환하므로 외부 파트너 계약이 아닙니다.

    `/api/partner/v1/...` 는 아직 코드에 없습니다. 인증 방식, 공개 베이스 URL,
    개인정보 필드 포함 여부는 확인 필요합니다. 이 초안은 그 필드를 기본 응답에서 뺍니다.

    날짜 파라미터 `YYYY-MM-DD`와 월 `YYYY-MM`은 Asia/Seoul입니다.
    저장 시각은 ISO-8601(timestamptz)입니다. 후보자 목록의 `created_at`만
    `YYYY-MM-DD HH:mm` KST 문자열이고, ISO는 `created_at_iso`입니다.

    가상 예시는 실재 고객이 아닙니다.
servers:
  - url: /
    description: 앱과 같은 호스트. 파트너용 공개 베이스 URL은 확인 필요.
tags:
  - name: internal-candidates
    description: 구현됨. 내부 전용. 저장소 tylife_b2b.
  - name: internal-tm001
    description: 구현됨. 내부 전용. partner_code 1.
  - name: internal-tm002
    description: 구현됨. 내부 전용. partner_code 2. 숙박 테이블 없음.
  - name: internal-calendar
    description: 구현됨. 내부 전용. 월 단위 병합 조회.
  - name: partner
    description: 미구현 초안. 외부 제공용.
paths:
  /api/admin/leads:
    get:
      tags: [internal-candidates]
      summary: 후보자 또는 소비자 목록
      x-implementation-status: implemented-internal
      description: |
        `category=candidates` 또는 `b2b`이면 `tylife_b2b`.
        그 외·생략은 소비자 `leads`이며 이 문서의 후보자 계약이 아닙니다.
        `merge_status`가 active이거나 비어 있는 행만. 블랙리스트 전화와 숨김 목록은 제외.
        `admin_statuses`가 있거나 category가 all이면 최대 3000건을 읽은 뒤 메모리에서 페이지를 자릅니다.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AssigneeIds"
        - $ref: "#/components/parameters/TeamIds"
        - $ref: "#/components/parameters/Regions"
        - $ref: "#/components/parameters/LeadStatuses"
        - $ref: "#/components/parameters/AdminStatuses"
        - $ref: "#/components/parameters/CsvEq"
        - in: query
          name: age_groups
          schema: { type: string }
          description: age_group 완전 일치 CSV
        - in: query
          name: jobs
          schema: { type: string }
          description: job 완전 일치 CSV
        - in: query
          name: entry_pages
          schema: { type: string }
          description: entry_page 완전 일치 CSV
        - in: query
          name: utm_sources
          schema: { type: string }
          description: utm_source 완전 일치 CSV
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Ids"
        - in: query
          name: need_reassign
          schema: { type: string, enum: ["1"] }
          description: 관리자상태 담당자 변경 필요. sales는 403. `recontact`도 같은 의미.
        - in: query
          name: tm_eligible
          schema: { type: string, enum: ["1"] }
          description: 동의 기준 TM 대상 id로 제한. 최대 2000 id.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: skip_count
          schema: { type: string, enum: ["1"] }
          description: total을 응답에서 뺌
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLeadList"
              example:
                ok: true
                total: 1
                items:
                  - id: "00000000-0000-4000-8000-000000000001"
                    type: 후보자
                    created_at: "2026-10-01 09:30"
                    created_at_iso: "2026-10-01T00:30:00.000Z"
                    name: 김가상
                    phone: 010-0000-0000
                    status: 대기
                    memo: "[2026-10-01 09:30] 대기"
                    admin_comment: ""
                    region: 서울
                    job: 회사원
                    job_rank: ""
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 조회 중 오류가 발생했습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                ok: false
                message: 조회 중 오류가 발생했습니다.
  /api/admin/tm001:
    get:
      tags: [internal-tm001]
      summary: TM001 고객 목록
      x-implementation-status: implemented-internal
      description: |
        `tm001_customers`에서 partner_code=1. 페이지 고객의 `tm001_stays`를 붙입니다.
        같은 업로드 차수·같은 정규화 전화번호는 1행입니다.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/QTm001"
        - in: query
          name: region
          schema: { type: string }
          description: tm001_stays.region 완전 일치
        - $ref: "#/components/parameters/TmStatus"
        - $ref: "#/components/parameters/AssigneeId"
        - $ref: "#/components/parameters/Unassigned"
        - $ref: "#/components/parameters/AssignedDate"
        - $ref: "#/components/parameters/Ids"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: meta
          schema: { type: string, enum: ["1"] }
          description: offset이 0이 아니면 이 값이 있어야 부가 집계를 포함
        - in: query
          name: skipRegions
          schema: { type: string, enum: ["1"] }
        - in: query
          name: skipStayTotal
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 목록. assignee_history는 admin·tm_admin만 채움.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTm001List"
              example:
                ok: true
                total: 1
                stayTotal: 1
                limit: 20
                offset: 0
                items:
                  - id: "00000000-0000-4000-8000-000000000101"
                    partner_code: "1"
                    batch_code: "014"
                    name: 이가상
                    phone: 010-1111-0000
                    status: 재콜
                    memo: ""
                    stays:
                      - hotel_name: 가상호텔
                        region: 제주
                        room: 디럭스
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 접근 권한이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                ok: false
                message: 접근 권한이 없습니다.
        "500":
          description: 예외 문구를 message로 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: TM001 테이블이 없습니다. supabase/migrations/045_tm001_affiliate.sql
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/admin/tm002:
    get:
      tags: [internal-tm002]
      summary: TM002 회원 목록
      x-implementation-status: implemented-internal
      description: |
        `tm002_customers`, partner_code=2. 숙박 배열 없음.
        엑셀의 카드번호·이메일·아이디 열은 저장하지 않습니다.
        sales는 403. region 파라미터는 없습니다.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/QTm002"
        - $ref: "#/components/parameters/TmStatus"
        - $ref: "#/components/parameters/AssigneeId"
        - $ref: "#/components/parameters/Unassigned"
        - $ref: "#/components/parameters/AssignedDate"
        - $ref: "#/components/parameters/Ids"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: 목록. assignee_history는 admin·tm_admin만 채움.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTm002List"
              example:
                ok: true
                total: 1
                limit: 20
                offset: 0
                items:
                  - id: "00000000-0000-4000-8000-000000000201"
                    partner_code: "2"
                    batch_code: "003"
                    status: 메신저완료
                    level: VIP
                    address: ""
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 접근 권한이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          description: 예외 문구를 message로 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: TM002 테이블이 없습니다. supabase/migrations/060_tm002.sql
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/admin/calendar:
    get:
      tags: [internal-calendar]
      summary: 월 일정 병합 목록
      x-implementation-status: implemented-internal
      description: |
        원천은 crm_calendar_events, 소비자·후보자 meeting_at 가상 일정,
        TM001·TM002 상담상태가 재콜인 meeting_at, admin만 구글 공개 iCal.
        tm_admin은 TM 재콜만. 구글 일정 실패는 나머지 일정을 그대로 반환합니다.
        페이지 파라미터는 없습니다.
      security:
        - AdminSessionCookie: []
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
          description: 생략 시 오늘(Asia/Seoul)의 YYYY-MM. 형식이 틀리면 400.
        - in: query
          name: types
          schema: { type: string }
          description: |
            CSV. 생략하면 lecture,general,important,deadline,holiday,meeting,call,google.
            목록에 없는 토큰은 무시.
      responses:
        "200":
          description: 해당 월 전체
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCalendarMonth"
              example:
                ok: true
                month: "2026-10"
                can_edit: true
                tm_only: false
                items:
                  - id: "00000000-0000-4000-8000-000000000301"
                    title: 가상 업무 일정
                    body: ""
                    event_date: "2026-10-03"
                    event_type: general
                    all_day: true
                    source: calendar
        "400":
          description: 월 형식이 올바르지 않습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                ok: false
                message: 월 형식이 올바르지 않습니다.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 일정을 불러오지 못했습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                ok: false
                message: 일정을 불러오지 못했습니다.
  /api/partner/v1/candidates:
    get:
      tags: [partner]
      summary: 후보자 조회 초안
      x-implementation-status: not-implemented
      description: |
        저장소는 tylife_b2b. 이름·전화·메모·코멘트·동의·담당자·광고 필드는
        이 초안 응답에 없습니다. 포함 여부는 확인 필요.
        인증 스킴은 구현되어 있지 않습니다.
      security:
        - PartnerCredential: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - in: query
          name: region
          schema: { type: string }
          description: region 부분 일치. 내부 조회와 같은 컬럼.
        - $ref: "#/components/parameters/PartnerLimit"
        - $ref: "#/components/parameters/PartnerOffset"
      responses:
        "200":
          description: 개인정보를 뺀 목록 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCandidateList"
              example:
                items:
                  - id: "00000000-0000-4000-8000-000000000001"
                    status: 대기
                    created_at: "2026-10-01T00:30:00.000Z"
                    region: 서울
                limit: 50
                offset: 0
                total: 1
        "400":
          $ref: "#/components/responses/PartnerInvalidQuery"
        "401":
          $ref: "#/components/responses/PartnerUnauthorized"
        "403":
          $ref: "#/components/responses/PartnerForbidden"
        "500":
          $ref: "#/components/responses/PartnerInternal"
  /api/partner/v1/tm001/customers:
    get:
      tags: [partner]
      summary: TM001 고객 조회 초안
      x-implementation-status: not-implemented
      description: |
        tm001_customers, partner_code=1. stays·이름·전화·메모는 이 초안 응답에 없습니다.
        숙박 제공 여부는 확인 필요.
      security:
        - PartnerCredential: []
      parameters:
        - $ref: "#/components/parameters/TmStatus"
        - $ref: "#/components/parameters/AssignedDate"
        - $ref: "#/components/parameters/PartnerLimit"
        - $ref: "#/components/parameters/PartnerOffset"
      responses:
        "200":
          description: 식별 최소화 목록 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerTm001List"
              example:
                items:
                  - id: "00000000-0000-4000-8000-000000000101"
                    batch_code: "014"
                    status: 재콜
                    updated_at: "2026-10-01T02:00:00.000Z"
                limit: 50
                offset: 0
                total: 1
        "400":
          $ref: "#/components/responses/PartnerInvalidQuery"
        "401":
          $ref: "#/components/responses/PartnerUnauthorized"
        "403":
          $ref: "#/components/responses/PartnerForbidden"
        "500":
          $ref: "#/components/responses/PartnerInternal"
  /api/partner/v1/tm002/customers:
    get:
      tags: [partner]
      summary: TM002 회원 조회 초안
      x-implementation-status: not-implemented
      description: |
        tm002_customers, partner_code=2. 주소·이름·전화·메모는 이 초안 응답에 없습니다.
        joined_at 포함 여부는 확인 필요. 예시에는 형식만 넣었습니다.
      security:
        - PartnerCredential: []
      parameters:
        - $ref: "#/components/parameters/TmStatus"
        - $ref: "#/components/parameters/AssignedDate"
        - $ref: "#/components/parameters/PartnerLimit"
        - $ref: "#/components/parameters/PartnerOffset"
      responses:
        "200":
          description: 식별 최소화 목록 초안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerTm002List"
              example:
                items:
                  - id: "00000000-0000-4000-8000-000000000201"
                    batch_code: "003"
                    status: 메신저완료
                    joined_at: "2024-05-02T15:00:00.000Z"
                    updated_at: "2026-10-01T02:00:00.000Z"
                limit: 50
                offset: 0
                total: 1
        "400":
          $ref: "#/components/responses/PartnerInvalidQuery"
        "401":
          $ref: "#/components/responses/PartnerUnauthorized"
        "403":
          $ref: "#/components/responses/PartnerForbidden"
        "500":
          $ref: "#/components/responses/PartnerInternal"
  /api/partner/v1/calendar/events:
    get:
      tags: [partner]
      summary: 월 일정 조회 초안
      x-implementation-status: not-implemented
      description: |
        구글 일정, lead_name, lead_phone은 넣지 않습니다.
        crm_calendar_events와 TM 재콜 중 어느 원천을 합칠지는 확인 필요.
        페이지 파라미터는 없습니다.
      security:
        - PartnerCredential: []
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
          description: Asia/Seoul 달력 월
      responses:
        "200":
          description: 업무 일정만 둔 예시
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCalendarMonth"
              example:
                month: "2026-10"
                time_zone: Asia/Seoul
                items:
                  - id: "00000000-0000-4000-8000-000000000301"
                    source: crm_calendar_events
                    event_date: "2026-10-03"
                    all_day: true
                    event_type: general
                    title: 가상 업무 일정
        "400":
          $ref: "#/components/responses/PartnerInvalidQuery"
        "401":
          $ref: "#/components/responses/PartnerUnauthorized"
        "403":
          $ref: "#/components/responses/PartnerForbidden"
        "500":
          $ref: "#/components/responses/PartnerInternal"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: HTTP-only JWT(HS256), 30일. 비밀키는 서버 ADMIN_SESSION_SECRET. 구현됨.
    PartnerCredential:
      type: http
      scheme: bearer
      description: 확인 필요. 코드에 파트너 자격 증명은 없습니다. Bearer는 초안 자리표시자입니다.
  parameters:
    Category:
      in: query
      name: category
      schema: { type: string }
      description: candidates 또는 b2b면 후보자 테이블. 생략하면 소비자 leads.
    Search:
      in: query
      name: search
      schema: { type: string }
      description: 이름, 전화, normalized_phone 부분 일치
    AssigneeIds:
      in: query
      name: assignee_ids
      schema: { type: string }
      description: 담당자 UUID CSV. __unassigned__는 미배정이며 admin만.
    TeamIds:
      in: query
      name: team_ids
      schema: { type: string }
      description: 직원 id 또는 그 parent_id인 담당 건
    Regions:
      in: query
      name: regions
      schema: { type: string }
      description: region 부분 일치 CSV. 후보자 조회는 location을 조건에 넣지 않음.
    LeadStatuses:
      in: query
      name: statuses
      schema: { type: string }
      description: LeadStatus CSV
    AdminStatuses:
      in: query
      name: admin_statuses
      schema: { type: string }
      description: |
        계산된 관리자상태 키 CSV. DB 컬럼이 아님.
        waiting_day, first_contact_day, absent_day, done_day, need_assign, need_reassign, need_recontact.
    CsvEq:
      in: query
      name: job_ranks
      schema: { type: string }
      description: job_rank 완전 일치 CSV
    DateFrom:
      in: query
      name: date_from
      schema: { type: string, format: date }
      description: KST 날짜 시작. 구현된 GET /api/admin/leads에서는 created_at에 적용. 파트너 경로는 미구현 초안.
    DateTo:
      in: query
      name: date_to
      schema: { type: string, format: date }
      description: created_at의 KST 날짜 끝. 당일 포함.
    Ids:
      in: query
      name: ids
      schema: { type: string }
      description: UUID CSV 최대 200. 지정 시 다른 검색조건은 무시하고 스코프만 유지.
    QTm001:
      in: query
      name: q
      schema: { type: string }
