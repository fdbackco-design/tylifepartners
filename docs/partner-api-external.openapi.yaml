openapi: 3.0.3
info:
  title: 파트너 조회 API
  version: 1.0.0
  description: |
    읽기 전용 파트너 API. Bearer API 키(`pk_live_…`)로 인증합니다.
    날짜·월 파라미터는 Asia/Seoul. 응답 시각은 ISO-8601입니다.
    limit 기본 50, 최대 200. 키마다 분당 호출 한도가 있습니다.
servers:
  - url: https://your-production-host.example
    description: 배포 호스트로 교체
security:
  - PartnerBearer: []
tags:
  - name: partner
paths:
  /api/partner/v1/candidates:
    get:
      tags: [partner]
      summary: 후보자 목록
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
        - in: query
          name: region
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateList"
              example:
                items:
                  - id: "00000000-0000-4000-8000-000000000001"
                    status: 대기
                    created_at: "2026-10-01T00:30:00.000Z"
                    region: 서울
                    job: 회사원
                    job_rank: ""
                    age_group: ""
                    entry_page: "/landing/example"
                    utm_source: partner_a
                limit: 50
                offset: 0
                total: 1
                time_zone: Asia/Seoul
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/partner/v1/tm001/customers:
    get:
      tags: [partner]
      summary: TM001 고객 목록
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: assigned_date
          schema: { type: string, format: date }
        - in: query
          name: batch_code
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tm001List"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/partner/v1/tm002/customers:
    get:
      tags: [partner]
      summary: TM002 회원 목록
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: assigned_date
          schema: { type: string, format: date }
        - in: query
          name: batch_code
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tm002List"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/partner/v1/calendar/events:
    get:
      tags: [partner]
      summary: 월 업무 일정
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: 해당 월 일정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarMonth"
              example:
                month: "2026-10"
                time_zone: Asia/Seoul
                items:
                  - id: "00000000-0000-4000-8000-000000000301"
                    event_date: "2026-10-03"
                    event_type: general
                    all_day: true
                    start_at: null
                    end_at: null
                    title: 가상 업무 일정
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    PartnerBearer:
      type: http
      scheme: bearer
      description: 발급받은 pk_live_… 키
  parameters:
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Unauthorized:
      description: unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
    Forbidden:
      description: forbidden 또는 scope_not_configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: 이 키는 TM002 조회 권한이 없습니다.
    InvalidQuery:
      description: invalid_query
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_query
            message: month 형식은 YYYY-MM 입니다.
    RateLimited:
      description: rate_limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
    Internal:
      description: internal_error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, scope_not_configured, invalid_query, rate_limited, internal_error]
        message:
          type: string
    Candidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        created_at: { type: string, description: ISO-8601 }
        region: { type: string }
        job: { type: string }
        job_rank: { type: string }
        age_group: { type: string }
        entry_page: { type: string }
        utm_source: { type: string }
    CandidateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
        time_zone: { type: string, example: Asia/Seoul }
    Tm001Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        batch_code: { type: string }
        status: { type: string }
        product: { type: string, nullable: true }
        updated_at: { type: string }
    Tm001List:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tm001Customer"
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
        time_zone: { type: string }
    Tm002Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        batch_code: { type: string }
        status: { type: string }
        level: { type: string }
        flag: { type: string }
        updated_at: { type: string }
    Tm002List:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tm002Customer"
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
        time_zone: { type: string }
    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        event_date: { type: string, format: date }
        event_type: { type: string }
        all_day: { type: boolean }
        start_at: { type: string, nullable: true }
        end_at: { type: string, nullable: true }
        title: { type: string }
    CalendarMonth:
      type: object
      properties:
        month: { type: string }
        time_zone: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
